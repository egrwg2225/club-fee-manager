<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>部費管理</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="loginSection">

  <h2>部費管理ログイン</h2>

  <input
    type="email"
    id="loginEmail"
    placeholder="メールアドレス"
  >

  <input
    type="password"
    id="loginPassword"
    placeholder="パスワード"
  >

  <button id="loginButton">
    ログイン
  </button>

  <p id="loginMessage"></p>

</div>


<div id="appContent" style="display:none;">

<header>

  <h1>部費管理</h1>

  <p id="userRole"></p>

  <button id="editorModeButton">
    🔒 編集者モード
  </button>

  <button
  id="changePasswordButton"
  style="display:none;"
>
  🔑 編集パスワード変更
</button>

</header>


<main>

  <!-- 月選択 -->

  <section class="month-area">

    <button id="prevMonth">‹</button>

    <h2 id="monthTitle">2026年9月</h2>

    <button id="nextMonth">›</button>

  </section>


  <!-- 残高 -->

  <section class="balance-card">

    <div class="balance-item">
      <span>前月繰越</span>
      <strong id="carryOver">0円</strong>
    </div>

    <div class="balance-item income">
      <span>収入合計</span>
      <strong id="incomeTotal">0円</strong>
    </div>

    <div class="balance-item expense">
      <span>支出合計</span>
      <strong id="expenseTotal">0円</strong>
    </div>

    <div class="balance-item total">
      <span>今月残高</span>
      <strong id="currentBalance">0円</strong>
    </div>

  </section>


  <!-- メニュー -->

  <section class="menu">

    <button onclick="showIncomeExpense()">
      収支入力
    </button>

    <button onclick="showMembers()">
      部費管理
    </button>

    <button onclick="showSummary()">
      月別集計
    </button>

    <button onclick="exportPDF()">
      A4 PDF出力
    </button>

  </section>


  <!-- 収支入力 -->

  <section id="incomeExpenseSection">

    <h2>収支入力</h2>

    <button id="addRowButton">
      ＋ 収支を追加
    </button>

    <button id="manageCategoryButton">
      ⚙ 分類を管理
    </button>

    <div id="categoryManagement" style="display:none;">

      <h3>分類管理</h3>

      <div id="categoryList"></div>

      <button id="addCategoryButton">
        ＋ 分類を追加
      </button>

    </div>

    <div class="table-wrapper">

      <table>

        <thead>

          <tr>
            <th>日付</th>
            <th>分類</th>
            <th>内訳</th>
            <th>収入</th>
            <th>支出</th>
            <th>メモ</th>
            <th></th>
          </tr>

        </thead>

        <tbody id="transactionTable">
        </tbody>

      </table>

    </div>

  </section>


  <!-- 部費管理 -->

  <section id="membersSection" style="display:none;">

    <h2>部費管理</h2>

    <button id="addMemberButton">
      ＋ 部員を追加
    </button>

    <label style="display:block; margin:15px 0;">
      <input
        type="checkbox"
        id="autoMemberFeeIncome"
        style="width:auto;"
      >
      支払済の部費を「収入」に自動反映する
    </label>

    <div class="table-wrapper">

      <table>

        <thead>

          <tr>
            <th>部員名</th>
            <th>月額部費</th>
            <th>支払い</th>
            <th>操作</th>
          </tr>

        </thead>

        <tbody id="membersTable">
        </tbody>

      </table>

    </div>

    <div id="memberSummary"></div>

  </section>


  <!-- 月別集計 -->

  <section id="summarySection" style="display:none;">

  <h2>月別集計</h2>

  <div id="summaryContent">

    <div class="summary-card">
      <h3>月間収支</h3>

      <div class="summary-row">
        <span>前月繰越</span>
        <strong id="summaryCarryOver">0円</strong>
      </div>

      <div class="summary-row">
        <span>収入合計</span>
        <strong id="summaryIncome">0円</strong>
      </div>

      <div class="summary-row">
        <span>支出合計</span>
        <strong id="summaryExpense">0円</strong>
      </div>

      <div class="summary-row summary-total">
        <span>今月残高</span>
        <strong id="summaryBalance">0円</strong>
      </div>
    </div>


    <div class="summary-card">

      <h3>収入の内訳</h3>

      <div id="summaryIncomeBreakdown">
        収入はありません。
      </div>

    </div>


    <div class="summary-card">

      <h3>支出の分類別</h3>

      <div id="summaryExpenseBreakdown">
        支出はありません。
      </div>

    </div>


    <div class="summary-card">

      <h3>部費状況</h3>

      <div class="summary-row">
        <span>請求予定</span>
        <strong id="summaryFeeExpected">0円</strong>
      </div>

      <div class="summary-row">
        <span>支払済</span>
        <strong id="summaryFeePaid">0円</strong>
      </div>

      <div class="summary-row">
        <span>未払い</span>
        <strong id="summaryFeeUnpaid">0円</strong>
      </div>

    </div>

  </div>

</section>

</main>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="script.js?v=3"></script>

</body>
</html>
